name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: zyhuka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zyhuka_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
        env:
          TEST_DATABASE_URL: postgres://postgres:integration_test_only@127.0.0.1:5432/zyhuka_test
          TEST_CREATE_SCHEMA: '1'
